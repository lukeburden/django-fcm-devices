[flake8]
ignore = E265,E501,W391
max-line-length = 100
max-complexity = 10
exclude = docs/*
inline-quotes = double

[isort]
multi_line_output=3
known_django=django
known_first_party=fcm_devices
sections=FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
include_trailing_comma=True
force_grid_wrap=0
use_parentheses=True
line_length=100
force_sort_within_sections=True
lines_after_imports=2

[coverage:run]
source = fcm_devices
omit = tests/*
branch = true
data_file = .coverage

[coverage:report]
omit = tests/*
show_missing = True

[tox]
env_list =
    checkqa
    py310-dj32-fcm{208,211}
    py{310,311,312}-dj42-fcm{208,211}
    py{310,311,312,313}-dj52-fcm{208,211}
skip_missing_interpreters = true

[testenv]
passenv =
    CI
    CIRCLECI
    CIRCLE_*
    TEST_DATABASE_ENGINE
    TEST_DATABASE_HOST
    TEST_DATABASE_NAME
    TEST_DATABASE_USER

# we assume use of semantic versioning on deps
deps =
    coverage
    pytest>=7
    pytest-django>=4.5
    pytest-mock>=3
    django-allauth>=0.37.0,<1
    model_bakery>=1.3.3
    responses>=0.23
    djangorestframework>=3.10
    django-konst>=3,<4
    pyfcm>=2.0.8,<3
    google-auth>=2.22.0
    cryptography
    python-dateutil>=2.8.0,<3
    dj32: Django==3.2.*
    dj42: Django==4.2.*
    dj52: Django==5.2.*
    fcm208: pyfcm==2.0.8
    fcm211: pyfcm==2.1.1

usedevelop = True
setenv =
    DJANGO_SETTINGS_MODULE=tests.settings
commands =
    coverage run -m pytest tests/tests.py {posargs}
    coverage report -m --skip-covered
    coverage xml

[testenv:checkqa]
commands =
    black --check .
    flake8 fcm_devices setup.py testproj tests
    isort --check-only --diff setup.py testproj tests
deps =
    black == 22.3.0
    flake8 == 3.8.4
    flake8-quotes == 3.2.0
    isort == 5.6.4

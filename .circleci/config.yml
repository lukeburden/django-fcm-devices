version: 2.1

orbs:
  codecov: codecov/codecov@4

jobs:
  checkqa:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: install dependencies
          command: pip install tox
      - run:
          name: run tox
          command: tox -e checkqa

  test:
    parameters:
      python:
        type: string
    docker:
      - image: cimg/python:<< parameters.python >>
    steps:
      - checkout
      - restore_cache:
          keys:
            - v5-deps-<< parameters.python >>-{{ checksum "setup.py" }}-{{ checksum "tox.ini" }}
      - run:
          name: install dependencies
          command: pip install tox
      - run:
          name: run tox
          # runs every env in tox.ini for this python, e.g. py310-dj{32,42,52}-fcm{208,211}
          command: tox -f py$(echo "<< parameters.python >>" | tr -d .)
      - save_cache:
          paths:
            - .tox
            - ~/.cache/pip
          key: v5-deps-<< parameters.python >>-{{ checksum "setup.py" }}-{{ checksum "tox.ini" }}
      - codecov/upload

workflows:
  test:
    jobs:
      - checkqa
      - test:
          matrix:
            parameters:
              python: ["3.10", "3.11", "3.12", "3.13"]
